<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Jam-Dash</title>
<style>
  :root {
    --bg: #fafafa; --card: #ffffff; --text: #212121; --muted: #616161; --border: #e0e0e0;
    --accent: #0277bd; --accent-text: #ffffff; --ok: #2e7d32; --warn: #ed6c02; --bad: #c62828; --unknown: #9e9e9e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111; --card: #1c1c1c; --text: #e1e1e1; --muted: #9e9e9e; --border: #2f2f2f;
      --accent: #03a9f4; --accent-text: #0b1a22; --ok: #66bb6a; --warn: #ffa726; --bad: #ef5350; --unknown: #757575;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px;
       grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  li { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
       display: flex; flex-direction: column; gap: 12px; }
  .name { font-size: 17px; font-weight: 500; margin: 0; overflow-wrap: anywhere; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--unknown); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  a.open {
    align-self: flex-start; text-decoration: none; background: var(--accent); color: var(--accent-text);
    padding: 8px 16px; border-radius: 8px; font-weight: 500;
  }
  a.open:hover { filter: brightness(1.08); }
  a.open:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Jam-Dash</h1>
  <p class="sub">Choose a server.</p>
  <ul id="servers" aria-label="Jam-Dash servers"></ul>
  <p id="msg" class="empty" role="status"></p>
</main>
<script>
(function () {
  "use strict";
  // Resolve relative to the ingress root, whether or not the URL ends in "/".
  var base = new URL(location.pathname.replace(/\/?$/, "/"), location.origin);
  var list = document.getElementById("servers");
  var msg = document.getElementById("msg");

  function setStatus(dot, text, cls, label) {
    dot.className = "dot " + cls;
    text.textContent = label;
  }

  function card(s) {
    var li = document.createElement("li");
    var h = document.createElement("h2");
    h.className = "name"; h.textContent = s.name;
    var st = document.createElement("div");
    st.className = "status";
    var dot = document.createElement("span");
    dot.className = "dot"; dot.setAttribute("aria-hidden", "true");
    var text = document.createElement("span");
    text.textContent = "Checking…";
    st.appendChild(dot); st.appendChild(text);
    var a = document.createElement("a");
    a.className = "open"; a.href = new URL(s.path, base).pathname;
    a.textContent = "Open"; a.setAttribute("aria-label", "Open " + s.name);
    li.appendChild(h); li.appendChild(st); li.appendChild(a);

    var ctl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 8000);
    fetch(new URL(s.path + "api/v1/auth/state", base), { credentials: "same-origin", signal: ctl && ctl.signal })
      .then(function (r) {
        if (r.ok) {
          return r.json().then(function (j) {
            if (j && j.via === "home_assistant") setStatus(dot, text, "ok", "Online, signed in" + (j.user ? " as " + j.user : ""));
            else setStatus(dot, text, "warn", "Online, not signed in via Home Assistant");
          }, function () { setStatus(dot, text, "ok", "Online"); });
        }
        if (r.status >= 500) setStatus(dot, text, "bad", "Not reachable (" + r.status + ")");
        else setStatus(dot, text, "warn", "Online (" + r.status + ")");
      })
      .catch(function () { setStatus(dot, text, "bad", "Not reachable"); })
      .then(function () { clearTimeout(timer); });
    return li;
  }

  fetch(new URL("servers.json", base), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (servers) {
      if (servers.length === 1) { location.replace(new URL(servers[0].path, base)); return; }
      if (!servers.length) { msg.textContent = "No servers configured."; return; }
      servers.forEach(function (s) { list.appendChild(card(s)); });
    })
    .catch(function () { msg.textContent = "Could not load the server list. Restart the add-on and check its log."; });
})();
</script>
</body>
</html>
