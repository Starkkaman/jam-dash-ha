name: Jam-Dash
version: "0.2.1"
slug: jam_dash
description: Open your Jam-Dash home-server dashboards inside Home Assistant.
url: https://github.com/Starkkaman/jam-dash-ha
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:view-dashboard-variant
panel_title: Jam-Dash
panel_admin: true
options:
  servers: []
schema:
  servers:
    - name: str
      url: url
      proxy_key: password
  # Pre-0.2.0 single-server options; used only when `servers` is empty.
  url: url?
  proxy_key: password?
